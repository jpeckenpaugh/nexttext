name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: After TestPyPI succeeds, also publish to PyPI
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Determine version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          print(f"version={wheel.name.split('-')[1]}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    outputs:
      published: ${{ steps.credentials.outputs.configured }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check TestPyPI credentials
        id: credentials
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -n "$TEST_PYPI_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=TestPyPI publish skipped::TEST_PYPI_API_TOKEN is not configured. Supply it through the Paperclip secret-proposal flow, then re-run this workflow."
          fi

      - name: Publish to TestPyPI
        if: steps.credentials.outputs.configured == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

  smoke-testpypi:
    name: Clean-install TestPyPI smoke
    needs: [build, publish-testpypi]
    if: always() && needs.build.result == 'success' && needs.publish-testpypi.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from TestPyPI in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/venv-testpypi"
          "${RUNNER_TEMP}/venv-testpypi/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/venv-testpypi/bin/pip" install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "nexttext==${{ needs.build.outputs.version }}"

      - name: Import and exercise the installed package
        run: |
          "${RUNNER_TEMP}/venv-testpypi/bin/python" - <<'PY'
          import nexttext

          assert nexttext.debias(["A man helped her."]) == ["A person helped them."]
          print("nexttext", nexttext.__all__)
          PY

  publish-pypi:
    name: Publish to PyPI
    needs: [build, publish-testpypi]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.publish-testpypi.outputs.published == 'true' &&
      (github.event_name == 'push' || inputs.publish_to_pypi == true)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    outputs:
      published: ${{ steps.credentials.outputs.configured }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check PyPI credentials
        id: credentials
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=PyPI publish skipped::PYPI_API_TOKEN is not configured. Supply it through the Paperclip secret-proposal flow, then re-run this workflow."
          fi

      - name: Publish to PyPI
        if: steps.credentials.outputs.configured == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  smoke-pypi:
    name: Clean-install PyPI smoke
    needs: [build, publish-pypi]
    if: always() && needs.build.result == 'success' && needs.publish-pypi.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm the release exists on PyPI
        run: |
          python - <<'PY'
          import json
          import urllib.request

          version = "${{ needs.build.outputs.version }}"
          with urllib.request.urlopen("https://pypi.org/pypi/nexttext/json") as response:
              data = json.load(response)
          assert version in data["releases"], f"{version} missing from PyPI releases"
          print(f"PyPI reports nexttext {version}")
          PY

      - name: Install from PyPI in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/venv-pypi"
          "${RUNNER_TEMP}/venv-pypi/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/venv-pypi/bin/pip" install "nexttext==${{ needs.build.outputs.version }}"

      - name: Import and exercise the installed package
        run: |
          "${RUNNER_TEMP}/venv-pypi/bin/python" - <<'PY'
          import nexttext

          assert nexttext.debias(["A man helped her."]) == ["A person helped them."]
          print("nexttext", nexttext.__all__)
          PY

  release-notes:
    name: Generate release notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate notes from CHANGELOG.md or commits
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          tag = "${{ github.ref_name }}"
          version = tag[1:] if tag.startswith("v") else tag
          notes = ""
          source = "none"

          changelog = Path("CHANGELOG.md")
          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              pattern = re.compile(
                  rf"^##\s+v?{re.escape(version)}(?:\s+-\s+.*)?\s*$",
                  re.MULTILINE | re.IGNORECASE,
              )
              match = pattern.search(text)
              if match:
                  rest = text[match.end() :]
                  next_heading = re.search(r"^##\s+", rest, re.MULTILINE)
                  section = rest[: next_heading.start()] if next_heading else rest
                  notes = section.strip()
                  if notes:
                      source = "CHANGELOG.md"

          if not notes:
              previous = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              previous_tag = previous.stdout.strip()
              revision_range = (
                  f"{previous_tag}..{tag}"
                  if previous.returncode == 0 and previous_tag
                  else tag
              )
              log = subprocess.run(
                  [
                      "git",
                      "log",
                      "--no-merges",
                      "--pretty=format:- %s (%h)",
                      revision_range,
                  ],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              notes = log.stdout.strip()
              if notes:
                  source = f"commits since {previous_tag}" if previous_tag else "commits"

          if not notes:
              notes = "No changelog entry or commits were available for this tag."
              print("::warning title=Release notes unavailable::Falling back to a placeholder body.")

          Path("RELEASE_NOTES.md").write_text(
              f"## {tag}\n\n{notes}\n", encoding="utf-8"
          )
          print(f"Generated release notes from {source} for {tag}")
          PY

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: warn

      - name: Attach notes to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning title=Release notes skipped::No notes file was generated; continuing without attaching notes."
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file RELEASE_NOTES.md
          else
            gh release create "$tag" --title "$tag" --notes-file RELEASE_NOTES.md --verify-tag
          fi
