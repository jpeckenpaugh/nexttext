name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest -q ${{ matrix.python-version == '3.11' && '--cov=nexttext --cov-report=term --cov-report=xml --cov-report=json' || '' }}

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload coverage data
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: error

  docs:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-docs.txt

      - name: Install package and docs tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt

      - name: Build documentation site
        run: python tools/build_docs_site.py

      - name: Validate documentation site
        run: python tools/check_docs_site.py

  badges:
    name: Update badges
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-json
          path: coverage-data

      - name: Install badge tools
        run: python -m pip install pyyaml

      - name: Generate badges
        run: |
          python - <<'PY'
          import json

          import yaml

          with open("coverage-data/coverage.json", encoding="utf-8") as handle:
              totals = json.load(handle)["totals"]
          percent = totals["percent_covered"]
          if percent >= 90:
              color = "brightgreen"
          elif percent >= 80:
              color = "green"
          elif percent >= 70:
              color = "yellowgreen"
          elif percent >= 60:
              color = "yellow"
          else:
              color = "red"
          with open("coverage.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "schemaVersion": 1,
                      "label": "coverage",
                      "message": f"{percent:.1f}%",
                      "color": color,
                  },
                  handle,
              )

          with open(".github/workflows/ci.yml", encoding="utf-8") as handle:
              workflow = yaml.safe_load(handle)
          versions = workflow["jobs"]["test"]["strategy"]["matrix"]["python-version"]
          with open("python-support.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "schemaVersion": 1,
                      "label": "python",
                      "message": " | ".join(versions),
                      "color": "3776AB",
                  },
                  handle,
              )
          PY

      - name: Publish badges branch
        run: |
          mkdir -p "${RUNNER_TEMP}/badges"
          cp coverage.json python-support.json "${RUNNER_TEMP}/badges/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git rm -rf .
          cp "${RUNNER_TEMP}/badges/coverage.json" .
          cp "${RUNNER_TEMP}/badges/python-support.json" .
          git add coverage.json python-support.json
          git commit -m "chore: update CI badges [skip ci]"
          git push --force origin badges
