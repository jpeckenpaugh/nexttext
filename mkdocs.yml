site_name: nexttext
site_description: A lightweight toolkit for neutralizing text and generating controlled bias for testing AI pipelines.
site_url: https://nexttext.livive.net/docs/
site_author: nexttext contributors
repo_url: https://github.com/jpeckenpaugh/nexttext
repo_name: jpeckenpaugh/nexttext
edit_uri: ""
copyright: nexttext is MIT licensed.
docs_dir: build/docs-src
site_dir: build/site/docs
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  custom_dir: docs-overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Live demo: https://nexttext.livive.net/
  - Cookbook: cookbook.md
  - API reference: api.md
  - Limitations: limitations.md
  - Intended use: intended-use.md
  - Theory: theory.md
  - Benchmarks:
      - Overview: benchmarks/index.md
      - 0.4.0 report: benchmarks/0.4.0.md
      - 0.3.0 report: benchmarks/0.3.0.md
  - Advanced backends: advanced-backends.md
  - Testing: testing.md
  - Performance notes: optimization.md
  - Contributing: contributing.md
  - Changelog: https://github.com/jpeckenpaugh/nexttext/blob/main/CHANGELOG.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            heading_level: 2
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false
