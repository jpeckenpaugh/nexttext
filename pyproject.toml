[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexttext"
version = "0.4.0"
description = "A lightweight toolkit for neutralizing text and generating controlled bias for testing AI pipelines."
authors = [
  { name = "NextText Maintainers" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["nlp", "bias", "debiasing", "text-processing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/jpeckenpaugh/nexttext"
Documentation = "https://nexttext.livive.net/docs/"
Repository = "https://github.com/jpeckenpaugh/nexttext"
Issues = "https://github.com/jpeckenpaugh/nexttext/issues"
Changelog = "https://github.com/jpeckenpaugh/nexttext/blob/main/CHANGELOG.md"

[project.scripts]
nexttext = "nexttext.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "build>=1.2",
  "twine>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "hypothesis>=6.0",
  "pandas>=1.5",
  "PyYAML>=6",
]
benchmark = ["datasets>=2.0", "language-tool-python>=2.7"]
nlp = ["spacy>=3.4"]
semantic = [
  "spacy>=3.4",
  "fastembed>=0.4; python_version >= '3.10'",
]
yaml = ["PyYAML>=6"]
pandas = ["pandas>=1.5"]
hf = ["datasets>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/nexttext"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/nexttext",
  "/tests",
  "/tools",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["nexttext"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "yaml", "spacy", "spacy.*", "fastembed", "fastembed.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["nexttext"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
